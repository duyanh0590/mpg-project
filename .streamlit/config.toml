# Giao diện AutoMPG Analytics: xanh navy, xanh dương, trắng, xám nhạt.
# Streamlit đọc file này khi chạy lệnh từ thư mục gốc dự án: streamlit run app/app.py
[theme]
base = "light"
primaryColor = "#1f6fd1"
backgroundColor = "#f4f6fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#1b2a41"
borderColor = "#dde3ec"
showWidgetBorder = true
baseRadius = "0.5rem"

[theme.sidebar]
backgroundColor = "#0b2545"
secondaryBackgroundColor = "#14365f"
textColor = "#e6edf7"
primaryColor = "#8db8f2"
borderColor = "#24477a"

[client]
toolbarMode = "viewer"
